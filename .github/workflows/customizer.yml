# Tests the web customizer and publishes it to GitHub Pages.
# Pull requests only run the tests; a push to master or a published release
# also deploys to https://tunakite03.github.io/Esp32-DeskPet/web/, with the
# latest release's firmware for the page's Firmware section.
name: Customizer

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - "deskpet/assets/pets.bin"
      - "deskpet/assets/manifest.json"
      - "deskpet/assets/page-mascot/**"
      - ".github/workflows/customizer.yml"
  pull_request:
    paths:
      - "web/**"
      - "deskpet/assets/pets.bin"
      - "deskpet/assets/manifest.json"
      - "deskpet/assets/page-mascot/**"
      - ".github/workflows/customizer.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pushes and releases share one group so two deployments never overlap.
  group: customizer-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  # Never cut a Pages deployment short; superseded PR runs can stop.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check the page scripts parse
        run: node --check web/app.js && node --check web/pack.js
      - name: Test the pack reader and writer
        run: node --test web/pack.test.mjs

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download the page-mascot gallery
        run: |
          pip install pillow
          python web/fetch_mascots.py
      # The page loads ../deskpet/assets/pets.bin and links the example sheets,
      # so the site keeps the repository layout for those paths.
      - name: Assemble the site
        run: |
          mkdir -p _site/web _site/deskpet/assets
          cp web/index.html web/app.js web/pack.js _site/web/
          cp -r web/mascots _site/web/
          cp deskpet/assets/pets.bin _site/deskpet/assets/
          cp -r deskpet/assets/page-mascot _site/deskpet/assets/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>DeskPet Customizer</title>
          <meta http-equiv="refresh" content="0; url=web/">
          <a href="web/">DeskPet Customizer</a>
          HTML
          find _site -type f | sort
      # GitHub's release download links send no CORS headers, so the page
      # fetches the latest release's images from the site itself.
      - name: Bundle the latest firmware release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/web/firmware
          cd _site/web/firmware
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'deskpet-v*-app.bin' --pattern 'deskpet-v*-full.bin'
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          app="deskpet-$tag-app.bin"
          full="deskpet-$tag-full.bin"
          test -s "$app"
          test -s "$full"
          jq -n --arg tag "$tag" --arg url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" \
            --arg app "$app" --arg full "$full" \
            --arg appSum "$(sha256sum "$app" | cut -d' ' -f1)" --arg fullSum "$(sha256sum "$full" | cut -d' ' -f1)" \
            '{tag: $tag, url: $url, app: $app, full: $full, sha256: {($app): $appSum, ($full): $fullSum}}' > latest.json
          cat latest.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}web/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
